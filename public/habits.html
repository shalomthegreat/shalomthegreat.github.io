<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Habit Tracker</title>
    <style>
      :root {
        --bg: #faf9f7;
        --card: #ffffff;
        --ink: #1a1a1a;
        --sub: #6b6b6b;
        --line: #e6e4e0;
        --accent: #2f6f5e;
        --accent-soft: #dcede7;
        --grow: #c48a2c;
        --warn: #8a6a00;
        --warn-soft: #f5ecc9;
        --danger: #b3543f;
        --on: #fff;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #15161a;
          --card: #1e2025;
          --ink: #f0efec;
          --sub: #9b9a97;
          --line: #2c2e33;
          --accent: #6fb59e;
          --accent-soft: #233c34;
          --grow: #e0b060;
          --warn: #e6c04a;
          --warn-soft: #3a3420;
          --danger: #e2897a;
          --on: #101418;
        }
      }
      :root[data-theme="dark"] {
        --bg: #15161a;
        --card: #1e2025;
        --ink: #f0efec;
        --sub: #9b9a97;
        --line: #2c2e33;
        --accent: #6fb59e;
        --accent-soft: #233c34;
        --grow: #e0b060;
        --warn: #e6c04a;
        --warn-soft: #3a3420;
        --danger: #e2897a;
        --on: #101418;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }
      header {
        padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 10px;
        background: var(--bg);
        position: sticky;
        top: 0;
        z-index: 5;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 19px;
        margin: 0 0 2px;
        letter-spacing: 0.2px;
      }
      .tag {
        font-size: 12px;
        color: var(--sub);
      }
      .scores {
        display: flex;
        gap: 16px;
        margin-top: 12px;
      }
      .score {
        flex: 1;
      }
      .progress-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 5px;
      }
      .progress-pct {
        font-size: 22px;
        font-weight: 700;
      }
      .progress-label {
        font-size: 11px;
        color: var(--sub);
        letter-spacing: 0.3px;
      }
      .bar-bg {
        height: 8px;
        border-radius: 5px;
        background: var(--line);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 5px;
        transition: width 0.3s ease;
        width: 0%;
      }
      .bld .bar-fill {
        background: var(--grow);
      }

      .days {
        display: flex;
        gap: 6px;
        margin-top: 12px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .day-chip {
        flex: 1;
        min-width: 38px;
        text-align: center;
        padding: 7px 0;
        border-radius: 10px;
        border: 1px solid var(--line);
        font-size: 12px;
        color: var(--sub);
        cursor: pointer;
        user-select: none;
        background: var(--card);
      }
      .day-chip .n {
        display: block;
        font-weight: 700;
        font-size: 13px;
        color: var(--ink);
      }
      .day-chip.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }
      .day-chip.active .n {
        color: var(--accent);
      }
      .day-chip.today {
        box-shadow: 0 0 0 1px var(--accent) inset;
      }

      main,
      #weekMain {
        flex: 1;
        overflow-y: auto;
        padding: 14px 18px 90px;
      }
      #weekMain {
        display: none;
      }
      .layout,
      .pane {
        display: contents;
      }
      .empty {
        color: var(--sub);
        font-size: 13px;
        text-align: center;
        margin-top: 40px;
        line-height: 1.5;
      }
      .block-card {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 9px;
      }
      #main .block-card {
        background: linear-gradient(90deg, var(--card), var(--accent-soft));
      }
      .block-emoji {
        font-size: 20px;
        width: 30px;
        text-align: center;
      }
      .block-name {
        flex: 1;
        font-size: 15px;
        font-weight: 600;
      }
      .sub {
        font-size: 11px;
        color: var(--sub);
        font-weight: 400;
        margin-top: 2px;
      }
      .block-check {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        font-size: 14px;
        color: transparent;
        transition: 0.15s;
      }
      .block-check.done {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on);
      }
      .bld-card .block-check.done {
        background: var(--grow);
        border-color: var(--grow);
      }

      nav.tabs {
        position: sticky;
        bottom: 0;
        display: flex;
        border-top: 1px solid var(--line);
        background: var(--bg);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      nav.tabs button {
        flex: 1;
        padding: 12px 0 10px;
        background: none;
        border: none;
        color: var(--sub);
        font-size: 12px;
        font-family: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      nav.tabs button .ic {
        font-size: 18px;
      }
      nav.tabs button.active {
        color: var(--accent);
        font-weight: 700;
      }

      .section-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--sub);
        margin: 18px 0 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .section-title:first-child {
        margin-top: 0;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
      }

      .setup-row {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 9px;
      }
      .setup-row-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .setup-row input[type="text"] {
        flex: 1;
        border: none;
        background: none;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        outline: none;
        min-width: 0;
      }
      .emoji-btn {
        width: 38px;
        font-size: 20px;
        border: none;
        background: none;
        padding: 0;
        flex-shrink: 0;
        cursor: pointer;
      }
      .del-btn {
        background: none;
        border: none;
        color: var(--sub);
        font-size: 18px;
        padding: 2px 6px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .pick {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 10px;
      }
      .pick button {
        font-size: 18px;
        background: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 3px 6px;
        cursor: pointer;
      }
      .pick input {
        width: 100%;
        margin-top: 4px;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font-size: 13px;
      }
      .meta {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .meta select {
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font-size: 12px;
      }
      .seg {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg button {
        border: none;
        background: none;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--sub);
        cursor: pointer;
      }
      .seg button.on {
        background: var(--accent);
        color: var(--on);
      }
      .seg button.on.g {
        background: var(--grow);
      }
      .stepper {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--sub);
      }
      .stepper button {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
      }
      .wk-toggle-row {
        display: flex;
        gap: 5px;
        margin-top: 10px;
      }
      .wk-toggle {
        flex: 1;
        text-align: center;
        padding: 5px 0;
        border-radius: 7px;
        font-size: 11px;
        border: 1px solid var(--line);
        color: var(--sub);
        cursor: pointer;
      }
      .wk-toggle.on {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on);
      }
      .hint {
        font-size: 12px;
        color: var(--grow);
        margin: 0 0 10px;
      }

      .add-btn {
        width: 100%;
        padding: 13px;
        border-radius: 14px;
        border: 1.5px dashed var(--line);
        background: none;
        color: var(--accent);
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        margin-top: 4px;
      }
      .week-detail {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 10px;
      }
      .week-detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
        font-size: 13px;
        border-bottom: 1px solid var(--line);
      }
      .week-detail-row:last-child {
        border-bottom: none;
      }
      .wd-day {
        color: var(--sub);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .wd-frac {
        font-weight: 600;
      }
      .mini {
        height: 6px;
        flex: 1;
        max-width: 110px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
      }
      .mini i {
        display: block;
        height: 100%;
        border-radius: 4px;
      }
      .day-chip.inert {
        cursor: default;
        pointer-events: none;
        opacity: 0.6;
      }
      .weeknav {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 18px;
        background: var(--bg);
        border-top: 1px solid var(--line);
      }
      .weeknav[hidden] {
        display: none;
      }
      .weeknav button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      .weeknav button:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .wk-label {
        flex: 1;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
      }
      .setup-row-top {
        gap: 8px;
      }
      .setup-row-top .seg {
        flex-shrink: 0;
      }
      .setup-row-top .seg button {
        padding: 5px 7px;
        font-size: 11px;
      }
      body.away nav.tabs button.active {
        color: var(--warn);
      }
      body.away .day-chip.active {
        border-color: var(--warn);
        background: var(--warn-soft);
        color: var(--warn);
      }
      body.away .day-chip.active .n {
        color: var(--warn);
      }
      .backbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
        display: flex;
        justify-content: center;
        pointer-events: none;
        z-index: 4;
      }
      .backbar button {
        pointer-events: auto;
        padding: 12px 22px;
        border-radius: 999px;
        border: none;
        background: var(--accent);
        color: var(--on);
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      }
      .seg button.on.n {
        background: var(--line);
        color: var(--ink);
        font-weight: 700;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 20;
      }
      .dlg {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        width: 100%;
        max-width: 320px;
      }
      .dlg-t {
        font-weight: 700;
        font-size: 16px;
        margin-bottom: 6px;
      }
      .dlg .sub {
        font-size: 13px;
        margin: 0 0 16px;
        line-height: 1.4;
      }
      .dlg-b {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .dlg-b button {
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      .dlg-b .danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
      .zone {
        margin-top: 18px;
      }
      .grip {
        width: 16px;
        text-align: center;
        color: var(--sub);
        font-size: 18px;
        line-height: 1;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        flex-shrink: 0;
      }
      .setup-row-top .emoji-btn {
        width: 30px;
      }
      .setup-row.dragging {
        z-index: 30;
        margin: 0;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      .ph {
        border: 1.5px dashed var(--accent);
        border-radius: 14px;
        margin-bottom: 9px;
        background: var(--accent-soft);
        opacity: 0.7;
      }
      .list:empty {
        border: 1.5px dashed var(--line);
        border-radius: 14px;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sub);
        font-size: 12px;
      }
      .list:empty::before {
        content: "Drag a block here";
      }
      .cat-input {
        flex: 1;
        min-width: 0;
        border: none;
        background: none;
        outline: none;
        font: inherit;
        text-transform: inherit;
        letter-spacing: inherit;
        color: inherit;
        padding: 0;
      }
      .add-section {
        margin-top: 26px;
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .add-title {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .add-section .sub {
        font-size: 13px;
        line-height: 1.45;
        margin: 0 0 14px;
      }
      .main-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 14px;
        background: var(--accent);
        color: var(--on);
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      }
      .main-btn:active {
        transform: translateY(1px);
      }
      .link-btn {
        display: block;
        margin: 12px auto 0;
        background: none;
        border: none;
        color: var(--sub);
        font-size: 12px;
        font-family: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      .dlg textarea {
        width: 100%;
        height: 130px;
        margin-bottom: 14px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font:
          11px/1.4 ui-monospace,
          Menlo,
          monospace;
        resize: none;
      }
      .dlg-b .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on);
      }
      @media (min-width: 900px) {
        body {
          max-width: 1100px;
          width: 100%;
          margin: 0 auto;
        }
        header {
          padding-left: 24px;
          padding-right: 24px;
        }
        .layout {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 420px;
          grid-template-rows: minmax(0, 1fr);
          flex: 1;
          min-height: 0;
        }
        .pane {
          display: flex;
          flex-direction: column;
          min-height: 0;
          min-width: 0;
        }
        .left {
          position: relative;
          border-right: 1px solid var(--line);
        }
        main,
        #weekMain {
          display: block;
          padding: 18px 24px 40px;
          min-height: 0;
        }
        .weeknav {
          padding-left: 24px;
          padding-right: 24px;
        }
        nav.tabs {
          position: static;
          border-top: none;
          border-bottom: 1px solid var(--line);
          padding-bottom: 0;
          flex-shrink: 0;
        }
        nav.tabs button {
          flex-direction: row;
          justify-content: center;
          gap: 8px;
          padding: 13px 0;
        }
        nav.tabs button[data-tab="week"] {
          display: none;
        }
        .backbar {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 20px;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      .hrow {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .gear {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--sub);
        font-size: 18px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .seg.wide {
        width: 100%;
      }
      .seg.wide button {
        flex: 1;
        padding: 8px 0;
        font-size: 13px;
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .sw {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        padding: 0;
        cursor: pointer;
        box-shadow: 0 0 0 1px var(--line) inset;
      }
      .sw.sel {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .sw.custom {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--card);
        color: var(--sub);
        font-size: 18px;
        overflow: visible;
      }
      .sw.custom input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="hrow">
        <div>
          <h1>Daily Rhythm</h1>
          <div class="tag" id="dateLabel">—</div>
        </div>
        <button class="gear" id="gear" aria-label="Appearance" title="Appearance">◐</button>
      </div>
      <div class="scores">
        <div class="score">
          <div class="progress-top">
            <span class="progress-pct" id="pctE">0%</span><span class="progress-label">Established</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" id="barE"></div></div>
        </div>
        <div class="score bld">
          <div class="progress-top">
            <span class="progress-pct" id="pctB">—</span><span class="progress-label">Building</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" id="barB"></div></div>
        </div>
      </div>
      <div class="days" id="dayChips"></div>
    </header>

    <div class="layout">
      <section class="pane left"><main id="main"></main></section>
      <section class="pane right">
        <div id="weekMain"></div>
        <div class="weeknav" id="weekbar" hidden></div>
      </section>
    </div>

    <nav class="tabs">
      <button data-tab="today" class="active"><span class="ic">✓</span>Today</button>
      <button data-tab="blocks"><span class="ic">▦</span>Blocks</button>
      <button data-tab="week"><span class="ic">◔</span>Week</button>
    </nav>

    <script>
      const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const KEYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
      const K1 = "rhythm_app_v1",
        K2 = "rhythm_app_v2";
      const WEEKDAYS = ["mon", "tue", "wed", "thu", "fri"];
      const EMOJIS = [
        "📚",
        "💼",

      const $ = (s) => document.querySelector(s);

      function h(tag, props = {}, kids = []) {
        const e = document.createElement(tag);
        for (const k in props) {
          if (k === "class") e.className = props[k];
          else if (k === "text") e.textContent = props[k];
          else if (k === "style") e.style.cssText = props[k];
          else e[k] = props[k];
        }
        [].concat(kids).forEach((c) => {
          if (c != null) e.append(c);

        return e;

      /* ---------- appearance ---------- */
      const PK = "rhythm_prefs";
      const SWATCHES = ["#2f6f5e", "#3b6fb6", "#6a5acd", "#b04f7a", "#c2603f", "#2a8f9e", "#5d6b7a", "#7a8f2f"];
      let prefs = { theme: "auto", color: "#2f6f5e" };
      try {
        Object.assign(prefs, JSON.parse(localStorage.getItem(PK) || "{}"));
      } catch (e) {}
      const dmq = window.matchMedia("(prefers-color-scheme: dark)");
      function savePrefs() {
        try {
          localStorage.setItem(PK, JSON.stringify(prefs));
        } catch (e) {}
      }
      function hexToHsl(hex) {
        const r = parseInt(hex.slice(1, 3), 16) / 255,
          g = parseInt(hex.slice(3, 5), 16) / 255,
          b = parseInt(hex.slice(5, 7), 16) / 255;
        const mx = Math.max(r, g, b),
          mn = Math.min(r, g, b),
          d = mx - mn,
          l = (mx + mn) / 2;
        let hh = 0,
          sat = 0;
        if (d) {
          sat = d / (1 - Math.abs(2 * l - 1));
          hh = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
          hh = (hh * 60 + 360) % 360;
        }
        return [hh, sat * 100, l * 100];
      }
      function applyPrefs() {
        const dark = prefs.theme === "dark" || (prefs.theme === "auto" && dmq.matches);
        const root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        const [hh, sat, l] = hexToHsl(prefs.color),
          S = Math.round(Math.min(sat, 70));
        root.style.setProperty(
          "--accent",
          dark
            ? `hsl(${Math.round(hh)}, ${Math.min(S, 55)}%, ${Math.round(Math.max(l, 64))}%)`
            : `hsl(${Math.round(hh)}, ${S}%, ${Math.round(Math.min(l, 38))}%)`
        );
        root.style.setProperty(
          "--accent-soft",
          dark ? `hsl(${Math.round(hh)}, 28%, 18%)` : `hsl(${Math.round(hh)}, 38%, 90%)`
        );
      }
      dmq.addEventListener("change", () => {
        if (prefs.theme === "auto") applyPrefs();
      });
      applyPrefs();

      function openSettings() {
        const close = () => ov.remove();
        const dlg = h("div", { class: "dlg", role: "dialog" });
        const ov = h(
          "div",
          {
            class: "ov",
            onclick: (e) => {
              if (e.target === ov) close();
            }
          },
          dlg
        );
        const set = (k, v) => {
          prefs[k] = v;
          savePrefs();
          applyPrefs();
          draw();
        };
        const draw = () => {
          const custom = !SWATCHES.includes(prefs.color);
          dlg.replaceChildren(
            h("div", { class: "dlg-t", text: "Appearance" }),
            h("div", { class: "sub", style: "margin:0 0 8px", text: "Theme" }),
            h(
              "div",
              { class: "seg wide" },
              ["auto", "light", "dark"].map((t) =>
                h("button", {
                  class: prefs.theme === t ? "on" : "",
                  text: t[0].toUpperCase() + t.slice(1),
                  onclick: () => set("theme", t)
                })
              )
            ),
            h("div", { class: "sub", style: "margin:18px 0 10px", text: "Main color" }),
            h(
              "div",
              { class: "swatches" },
              SWATCHES.map((c) =>
                h("button", {
                  class: "sw" + (prefs.color === c ? " sel" : ""),
                  style: "background:" + c,
                  ariaLabel: c,
                  onclick: () => set("color", c)
                })
              ).concat(
                h(
                  "label",
                  {
                    class: "sw custom" + (custom ? " sel" : ""),
                    style: custom ? "background:" + prefs.color : "",
                    title: "Custom color"
                  },
                  [
                    custom ? "" : "+",
                    h("input", {
                      type: "color",
                      value: prefs.color,
                      oninput: (e) => {
                        prefs.color = e.target.value;
                        savePrefs();
                        applyPrefs();
                      },
                      onchange: () => draw()
                    })
                  ]
                )
              )
            ),
            h(
              "div",
              { class: "dlg-b", style: "margin-top:20px" },
              h("button", { class: "primary", text: "Done", onclick: close })
            )
          );
        };
        draw();
        document.body.append(ov);
      }
      $("#gear").onclick = openSettings;

      /* ---------- state ---------- */
      function isoDate(d) {
        const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0, 10);
      }
      const todayISO = () => isoDate(new Date());
      const dowKey = (d) => KEYS[(d.getDay() + 6) % 7];

      function defCats() {
        return [
          { id: "body", name: "Body", color: "#d98b5f" },
          { id: "mind", name: "Mind", color: "#7f9fd6" },
          { id: "build", name: "Build", color: "#2f9f7e" },
          { id: "connect", name: "Connect", color: "#d9739b" },
          { id: "maintain", name: "Maintain", color: "#b0a07a" }
        ];
      }
      function mk(id, name, emoji, cat, days) {
        return { id, name, emoji, cat, stage: "established", days, weeklyTarget: 3, startedOn: todayISO() };
      }
      function fresh() {
        return {
          cats: defCats(),
          blocks: [
            {
              ...mk("b1790722665902", "Connect with a Friend", "☎️", "connect", WEEKDAYS),
              stage: "building",
              weeklyTarget: 3
            },
            { ...mk("b1790722660583", "Clean Home", "🧽", "maintain", ["sat", "sun"]), weeklyTarget: 2 },
            mk("b4", "Walk", "🚶", "body", KEYS.slice()),
            { ...mk("b1", "Study", "📚", "build", WEEKDAYS), stage: "building", weeklyTarget: 2 },
            mk("b3", "Create", "🎨", "mind", ["tue", "thu", "sat"])
          ],
          log: {}
        };
      }
      function migrate(o) {
        const log = {};
        Object.entries(o.log || {}).forEach(([k, v]) => {
          log[k] = { done: v };
        });
        return {
          cats: defCats(),
          blocks: (o.blocks || []).map((b) => {
            const nb = mk(
              b.id,
              b.name,
              b.emoji,
              /walk|sleep|food|gym|run|move/i.test(b.name) ? "body" : "build",
              b.days || []
            );
            return nb;
          }),
          log
        };
      }
      function loadState() {
        try {
          const r = localStorage.getItem(K2);
          if (r) return JSON.parse(r);
          const old = localStorage.getItem(K1);
          if (old) return migrate(JSON.parse(old));
        } catch (e) {
          console.warn("storage read failed", e);
        }
        return fresh();
      }
      function saveState() {
        try {
          localStorage.setItem(K2, JSON.stringify(state));
        } catch (e) {
          console.warn("storage write failed", e);
        }
      }

      let state = loadState();
      let activeTab = "today";
      let viewDate = new Date();
      let pickId = null;

      const byId = (id) => state.blocks.find((b) => b.id === id);

      /* ---------- dates ---------- */
      function startOfWeek(d) {
        const nd = new Date(d);
        nd.setDate(nd.getDate() - ((nd.getDay() + 6) % 7));
        nd.setHours(0, 0, 0, 0);
        return nd;
      }
      function weekDates(d) {
        const s = startOfWeek(d);
        return Array.from({ length: 7 }, (_, i) => {
          const x = new Date(s);
          x.setDate(s.getDate() + i);
          return x;
        });
      }
      const fmtDateLabel = (d) => d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });

      /* ---------- history: freeze what was planned on past days ---------- */
      function plannedIds(d) {
        const L = state.log[isoDate(d)];
        if (L && L.planned) return L.planned;
        const k = dowKey(d);
        return state.blocks.filter((b) => b.stage === "established" && b.days.includes(k)).map((b) => b.id);
      }
      function snapPast() {
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        for (let i = 1; i <= 28; i++) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          const iso = isoDate(d);
          const L = state.log[iso] || (state.log[iso] = { done: {} });
          if (!L.planned) L.planned = plannedIds(d);
        }
      }
      function mut(fn) {
        snapPast();
        fn();
        saveState();
        renderAll();
      }

      /* ---------- stats ---------- */
      function weekStats(ref) {
        const t = new Date();
        t.setHours(0, 0, 0, 0);
        const dates = weekDates(ref);
        let p = 0,
          dn = 0;
        const cats = {},
          perDay = [];
        dates.forEach((d) => {
          if (d > t) {
            perDay.push({ d, future: true });
            return;
          }
          const L = state.log[isoDate(d)] || { done: {} };
          let dp = 0,
            dd = 0;
          plannedIds(d).forEach((id) => {
            const b = byId(id);
            if (!b) return;
            const ok = !!L.done[id];
            dp++;
            if (ok) dd++;
            const c = cats[b.cat] || (cats[b.cat] = { p: 0, d: 0 });
            c.p++;
            if (ok) c.d++;
          });
          p += dp;
          dn += dd;
          perDay.push({ d, p: dp, dd });
        });
        const items = state.blocks
          .filter((b) => b.stage === "building")
          .map((b) => ({
            b,
            n: dates.filter((d) => {
              const L = state.log[isoDate(d)];
              return L && L.done[b.id];
            }).length
          }));
        const tt = items.reduce((s, i) => s + i.b.weeklyTarget, 0);
        const tn = items.reduce((s, i) => s + Math.min(i.n, i.b.weeklyTarget), 0);
        return {
          p,
          dn,
          pct: p ? Math.round((100 * dn) / p) : 0,
          cats,
          perDay,
          items,
          bpct: tt ? Math.round((100 * tn) / tt) : null
        };
      }
      function weeksIn(b) {
        return Math.floor((new Date(todayISO()) - new Date(b.startedOn)) / (7 * 864e5)) + 1;
      }
      function g1(s) {
        s = s.trim();
        if (!s) return "";
        return window.Intl && Intl.Segmenter ? [...new Intl.Segmenter().segment(s)][0].segment : Array.from(s)[0];
      }

      /* ---------- render ---------- */
      function renderHeader() {
        const wd = weekDates(viewDate),
          sd = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
        $("#dateLabel").textContent =
          activeTab === "week" ? `Week of ${sd(wd[0])} – ${sd(wd[6])}` : fmtDateLabel(viewDate);
        const w = weekStats(viewDate);
        $("#pctE").textContent = w.pct + "%";
        $("#barE").style.width = w.pct + "%";
        $("#pctB").textContent = w.bpct == null ? "—" : w.bpct + "%";
        $("#barB").style.width = (w.bpct || 0) + "%";
        const chips = $("#dayChips");
        chips.innerHTML = "";
        const tIso = todayISO(),
          vIso = isoDate(viewDate);
        const pickable = activeTab === "today";
        weekDates(viewDate).forEach((d, i) => {
          const iso = isoDate(d);
          const props = {
            class:
              "day-chip" +
              (pickable && iso === vIso ? " active" : "") +
              (iso === tIso ? " today" : "") +
              (pickable ? "" : " inert")
          };
          if (pickable)
            props.onclick = () => {
              viewDate = d;
              renderAll();
            };
          chips.append(h("div", props, [DOW[i][0], h("span", { class: "n", text: d.getDate() })]));
        });
        const away = activeTab === "today" && vIso !== tIso;
        document.body.classList.toggle("away", away);
      }

      function card(b, iso, sub, cls) {
        const L = state.log[iso];
        const done = !!(L && L.done[b.id]);
        return h("div", { class: "block-card " + (cls || "") }, [
          h("div", { class: "block-emoji", text: b.emoji }),
          h("div", { class: "block-name" }, [b.name, sub ? h("div", { class: "sub", text: sub }) : null]),
          h("div", {
            class: "block-check" + (done ? " done" : ""),
            text: "✓",
            onclick: () => {
              const l = state.log[iso] || (state.log[iso] = { done: {} });
              l.done[b.id] = !l.done[b.id];
              saveState();
              renderAll();
            }
          })
        ]);
      }

      function backBar() {
        if (isoDate(viewDate) === todayISO()) return;
        $("#main").append(
          h(
            "div",
            { class: "backbar" },
            h("button", {
              text: "↩ Back to today",
              onclick: () => {
                viewDate = new Date();
                renderAll();
              }
            })
          )
        );
      }

      function renderToday() {
        const main = $("#main");
        main.innerHTML = "";
        const iso = isoDate(viewDate);
        const est = plannedIds(viewDate).map(byId).filter(Boolean);
        const bld = state.blocks.filter((b) => b.stage === "building");
        if (!est.length && !bld.length) {
          main.append(
            h("div", {
              class: "empty",
              innerHTML: "Nothing planned for this day yet.<br>Add blocks in the Blocks tab."
            })
          );
          backBar();
          return;
        }
        state.cats.forEach((c) => {
          const items = est.filter((b) => b.cat === c.id);
          if (!items.length) return;
          main.append(
            h("div", { class: "section-title" }, [h("span", { class: "dot", style: "background:" + c.color }), c.name])
          );
          items.forEach((b) => main.append(card(b, iso)));
        });
        if (bld.length) {
          const w = weekStats(viewDate);
          main.append(h("div", { class: "section-title", style: "color:var(--grow)" }, "Building"));
          bld.forEach((b) => {
            const n = (w.items.find((i) => i.b.id === b.id) || { n: 0 }).n;
            const k = weeksIn(b);
            main.append(
              card(
                b,
                iso,
                `${n}/${b.weeklyTarget} this week · week ${k}` + (k > 4 ? " · ready to promote?" : ""),
                "bld-card"
              )
            );
          });
        }
        backBar();
      }

      function confirmRemove(b) {
        const close = () => ov.remove();
        const ov = h(
          "div",
          {
            class: "ov",
            onclick: (e) => {
              if (e.target === ov) close();
            }
          },
          h("div", { class: "dlg", role: "dialog" }, [
            h("div", { class: "dlg-t", text: `Remove “${b.name}”?` }),
            h("p", { class: "sub", text: "It will also disappear from past weeks’ totals. This can’t be undone." }),
            h("div", { class: "dlg-b" }, [
              h("button", { text: "Cancel", onclick: close }),
              h("button", {
                class: "danger",
                text: "Remove",
                onclick: () => {
                  close();
                  mut(() => {
                    state.blocks = state.blocks.filter((x) => x.id !== b.id);
                  });
                }
              })
            ])
          ])
        );
        document.body.append(ov);
      }

      function startDrag(e, row, b) {
        if (e.button > 0) return;
        e.preventDefault();
        const main = $("#main"),
          grip = e.currentTarget,
          r = row.getBoundingClientRect();
        const ph = h("div", { class: "ph", style: `height:${r.height}px` });
        row.parentNode.insertBefore(ph, row);
        row.classList.add("dragging");
        row.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;`;
        const offY = e.clientY - r.top;
        let lastY = e.clientY,
          sy = 0,
          on = true;
        grip.setPointerCapture(e.pointerId);

        const place = (y) => {
          row.style.top = y - offY + "px";
          let best = null,
            bd = Infinity;
          document.querySelectorAll(".zone").forEach((z) => {
            const q = z.getBoundingClientRect();
            const d = y < q.top ? q.top - y : y > q.bottom ? y - q.bottom : 0;
            if (d < bd) {
              bd = d;
              best = z;
            }
          });
          const list = best.querySelector(".list");
          const next = [...list.querySelectorAll(":scope > .setup-row")]
            .filter((x) => x !== row)
            .find((x) => {
              const q = x.getBoundingClientRect();
              return y < q.top + q.height / 2;
            });
          if (next) list.insertBefore(ph, next);
          else list.append(ph);
        };
        const move = (ev) => {
          lastY = ev.clientY;
          place(lastY);
          const q = main.getBoundingClientRect();
          sy = lastY < q.top + 70 ? -8 : lastY > q.bottom - 70 ? 8 : 0;
        };
        const loop = () => {
          if (!on) return;
          if (sy) {
            main.scrollTop += sy;
            place(lastY);
          }
          requestAnimationFrame(loop);
        };
        const end = (ev) => {
          on = false;
          grip.removeEventListener("pointermove", move);
          grip.removeEventListener("pointerup", end);
          grip.removeEventListener("pointercancel", end);
          if (ev.type === "pointercancel") {
            renderAll();
            return;
          }
          let n = ph.nextElementSibling;
          while (n === row) n = n.nextElementSibling;
          const cat = ph.closest(".zone").dataset.cat;
          state.blocks = state.blocks.filter((x) => x !== b);
          b.cat = cat;
          if (n) {
            state.blocks.splice(
              state.blocks.findIndex((x) => x.id === n.dataset.id),
              0,
              b
            );
          } else {
            let last = -1;
            state.blocks.forEach((x, i) => {
              if (x.cat === cat) last = i;
            });
            state.blocks.splice(last + 1, 0, b);
          }
          saveState();
          renderAll();
        };
        grip.addEventListener("pointermove", move);
        grip.addEventListener("pointerup", end);
        grip.addEventListener("pointercancel", end);
        requestAnimationFrame(loop);
      }

      function blockRow(b) {
        const row = h("div", { class: "setup-row" });
        row.dataset.id = b.id;
        const setStage = (s) =>
          mut(() => {
            if (b.stage === s) return;
            b.stage = s;
            if (s === "building") b.startedOn = todayISO();
            else if (!b.days.length) b.days = WEEKDAYS.slice();
          });
        const seg = h("div", { class: "seg" }, [
          h("button", {
            class: b.stage === "building" ? "on g" : "",
            text: "Building",
            onclick: () => setStage("building")
          }),
          h("button", {
            class: b.stage === "established" ? "on n" : "",
            text: "Established",
            onclick: () => setStage("established")
          })
        ]);
        const grip = h("div", { class: "grip", text: "⠿", title: "Drag to reorder or move to another category" });
        grip.onpointerdown = (e) => startDrag(e, row, b);
        row.append(
          h("div", { class: "setup-row-top" }, [
            grip,
            h("button", {
              class: "emoji-btn",
              text: b.emoji,
              onclick: () => {
                pickId = pickId === b.id ? null : b.id;
                renderAll();
              }
            }),
            h("input", {
              type: "text",
              value: b.name,
              oninput: (e) => {
                b.name = e.target.value;
                saveState();
              }
            }),
            seg,
            h("button", { class: "del-btn", text: "✕", onclick: () => confirmRemove(b) })
          ])
        );

        if (pickId === b.id) {
          const setE = (em) => {
            if (!em) return;
            b.emoji = em;
            pickId = null;
            saveState();
            renderAll();
          };
          const custom = h("input", {
            type: "text",
            placeholder: "Or type your own emoji, then press Enter",
            onkeydown: (e) => {
              if (e.key === "Enter") setE(g1(e.target.value));
            }
          });
          row.append(
            h(
              "div",
              { class: "pick" },
              EMOJIS.map((em) => h("button", { text: em, onclick: () => setE(em) })).concat(custom)
            )
          );
        }

        if (b.stage === "building") {
          const step = (n) =>
            mut(() => {
              b.weeklyTarget = Math.max(1, Math.min(7, b.weeklyTarget + n));
            });
          row.append(
            h(
              "div",
              { class: "meta" },
              h("div", { class: "stepper" }, [
                "Target",
                h("button", { text: "−", onclick: () => step(-1) }),
                h("b", { text: b.weeklyTarget + "× / week", style: "color:var(--ink)" }),
                h("button", { text: "+", onclick: () => step(1) })
              ])
            )
          );
        } else {
          const tr = h("div", { class: "wk-toggle-row" });
          KEYS.forEach((dk, i) =>
            tr.append(
              h("div", {
                class: "wk-toggle" + (b.days.includes(dk) ? " on" : ""),
                text: DOW[i][0],
                onclick: () =>
                  mut(() => {
                    b.days = b.days.includes(dk) ? b.days.filter((x) => x !== dk) : b.days.concat(dk);
                  })
              })
            )
          );
          row.append(tr);
        }
        return row;
      }

      function renderBlocks() {
        const main = $("#main");
        main.innerHTML = "";
        main.append(
          h("div", {
            class: "sub",
            style: "margin-bottom:2px",
            text: "Drag ⠿ to reorder blocks or move them between categories."
          })
        );
        if (state.blocks.filter((b) => b.stage === "building").length > 2)
          main.append(
            h("p", {
              class: "hint",
              style: "margin-top:8px",
              text: "3+ habits in Building at once splits your focus. Consider pausing one."
            })
          );

        state.cats.forEach((c) => {
          const zone = h("div", { class: "zone" });
          zone.dataset.cat = c.id;
          zone.append(
            h("div", { class: "section-title" }, [
              h("span", { class: "dot", style: "background:" + c.color }),
              h("input", {
                type: "text",
                class: "cat-input",
                value: c.name,
                oninput: (e) => {
                  c.name = e.target.value;
                  saveState();
                }
              })
            ])
          );
          const list = h("div", { class: "list" });
          state.blocks.filter((b) => b.cat === c.id).forEach((b) => list.append(blockRow(b)));
          zone.append(list);
          main.append(zone);
        });

        main.append(
          h("div", { class: "add-section" }, [
            h("div", { class: "add-title", text: "Add a block" }),
            h("p", {
              class: "sub",
              text: "A block is anything you want to show up for each week. New blocks start in Building with a weekly target and land under Build; drag one wherever it belongs. Once it sticks, switch it to Established and pick its days."
            }),
            h("button", { class: "main-btn", text: "+ Add block", onclick: addBlock }),
            h("button", { class: "link-btn", text: "Export setup", onclick: showExport })
          ])
        );
      }

      function addBlock() {
        const id = "b" + Date.now();
        mut(() => {
          state.blocks.push({
            id,
            name: "New habit",
            emoji: "🌱",
            cat: "build",
            stage: "building",
            days: WEEKDAYS.slice(),
            weeklyTarget: 2,
            startedOn: todayISO()
          });
        });
        const r = document.querySelector(`.setup-row[data-id="${id}"]`);
        if (r) {
          r.scrollIntoView({ block: "center" });
          const i = r.querySelector("input[type=text]");
          i.focus();
          i.select();
        }
      }

      function showExport() {
        const txt = JSON.stringify({
          cats: state.cats,
          blocks: state.blocks.map(({ id, name, emoji, cat, stage, days, weeklyTarget }) => ({
            id,
            name,
            emoji,
            cat,
            stage,
            days,
            weeklyTarget
          }))
        });
        const close = () => ov.remove();
        const ta = h("textarea", { readOnly: true, value: txt, onfocus: (e) => e.target.select() });
        const copyBtn = h("button", {
          class: "primary",
          text: "Copy",
          onclick: async () => {
            ta.focus();
            ta.select();
            ta.setSelectionRange(0, txt.length);
            let ok = false;
            try {
              if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(txt);
                ok = true;
              }
            } catch (err) {}
            if (!ok) {
              try {
                ok = document.execCommand("copy");
              } catch (err) {}
            }
            copyBtn.textContent = ok ? "Copied" : "Selected: copy manually";
          }
        });
        const ov = h(
          "div",
          {
            class: "ov",
            onclick: (e) => {
              if (e.target === ov) close();
            }
          },
          h("div", { class: "dlg", role: "dialog" }, [
            h("div", { class: "dlg-t", text: "Your setup" }),
            h("p", {
              class: "sub",
              text: "Your categories and blocks, without any history. Copy this to back it up or to use it as the app’s starting setup."
            }),
            ta,
            h("div", { class: "dlg-b" }, [h("button", { text: "Close", onclick: close }), copyBtn])
          ])
        );
        document.body.append(ov);
      }

      function barRow(label, right, pct, color, dot) {
        return h("div", { class: "week-detail-row" }, [
          h("span", { class: "wd-day" }, [dot ? h("span", { class: "dot", style: "background:" + dot }) : null, label]),
          h("div", { class: "mini" }, h("i", { style: `width:${pct}%;background:${color}` })),
          h("span", { class: "wd-frac", text: right })
        ]);
      }

      function shiftWeek(n) {
        const nd = new Date(viewDate);
        nd.setDate(nd.getDate() + 7 * n);
        const cur = startOfWeek(new Date()).getTime();
        if (startOfWeek(nd).getTime() > cur) return;
        viewDate = startOfWeek(nd).getTime() === cur ? new Date() : nd;
        renderAll();
      }
      function weekNav() {
        const ds = weekDates(viewDate),
          f = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
        const isCur = startOfWeek(viewDate).getTime() >= startOfWeek(new Date()).getTime();
        return h("div", { class: "weeknav" }, [
          h("button", { text: "‹", ariaLabel: "Previous week", onclick: () => shiftWeek(-1) }),
          h("div", { class: "wk-label" }, [
            f(ds[0]) + " – " + f(ds[6]),
            isCur ? h("div", { class: "sub", text: "This week" }) : null
          ]),
          h("button", { text: "›", ariaLabel: "Next week", disabled: isCur, onclick: () => shiftWeek(1) })
        ]);
      }

      function renderWeek(main) {
        main.innerHTML = "";
        const w = weekStats(viewDate);

        main.append(h("div", { class: "section-title", text: "Established · day by day" }));
        const box = h("div", { class: "week-detail" });
        w.perDay.forEach((x, i) =>
          box.append(
            h("div", { class: "week-detail-row" }, [
              h("span", { class: "wd-day", text: DOW[i] + " " + x.d.getDate() }),
              h("span", { class: "wd-frac", text: x.future ? "not yet" : x.p ? x.dd + " / " + x.p : "—" })
            ])
          )
        );
        main.append(box);

        main.append(h("div", { class: "section-title", text: "Established · balance by category" }));
        const cb = h("div", { class: "week-detail" });
        state.cats.forEach((c) => {
          const s = w.cats[c.id];
          if (s) cb.append(barRow(c.name, s.d + " / " + s.p, Math.round((100 * s.d) / s.p), c.color, c.color));
        });
        if (!cb.children.length) cb.append(h("div", { class: "sub", text: "Nothing counted yet this week." }));
        main.append(cb);

        main.append(h("div", { class: "section-title", style: "color:var(--grow)", text: "Building · this week" }));
        const bb = h("div", { class: "week-detail" });
        w.items.forEach(({ b, n }) =>
          bb.append(
            barRow(
              b.emoji + " " + b.name,
              n + " / " + b.weeklyTarget,
              Math.min(100, Math.round((100 * n) / b.weeklyTarget)),
              "var(--grow)"
            )
          )
        );
        if (!w.items.length)
          bb.append(h("div", { class: "sub", text: "No habits in Building. Add one in the Blocks tab." }));
        main.append(bb);
      }

      const mq = window.matchMedia("(min-width: 900px)");
      const desk = () => mq.matches;
      function syncTab(t) {
        activeTab = t;
        document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === t));
      }
      function placeNav() {
        const nav = document.querySelector("nav.tabs");
        if (desk()) $(".left").prepend(nav);
        else document.body.append(nav);
      }
      function renderBar() {
        const bar = $("#weekbar");
        bar.hidden = !(desk() || activeTab === "week");
        if (!bar.hidden) bar.replaceChildren(...weekNav().childNodes);
      }

      function renderAll() {
        if (desk() && activeTab === "week") syncTab("today");
        renderHeader();
        renderBar();
        if (desk()) {
          renderWeek($("#weekMain"));
          if (activeTab === "blocks") renderBlocks();
          else renderToday();
        } else if (activeTab === "today") renderToday();
        else if (activeTab === "blocks") renderBlocks();
        else renderWeek($("#main"));
      }

      document.querySelectorAll("nav.tabs button").forEach((btn) => {
        btn.onclick = () => {
          if (btn.dataset.tab === "today" && activeTab === "today") {
            viewDate = new Date();
            renderAll();
            return;
          }
          syncTab(btn.dataset.tab);
          renderAll();
        };
      });

      mq.addEventListener("change", () => {
        placeNav();
        renderAll();
      });
      placeNav();
      snapPast();
      saveState();
      renderAll();
    </script>
  </body>
</html>
