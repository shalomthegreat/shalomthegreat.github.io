<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Habit Tracker</title>
    <style>
      :root {
        --bg: #faf9f7;
        --card: #ffffff;
        --ink: #1a1a1a;
        --sub: #6b6b6b;
        --line: #e6e4e0;
        --accent: #2f6f5e;
        --accent-soft: #dcede7;
        --grow: #c48a2c;
        --warn: #8a6a00;
        --warn-soft: #f5ecc9;
        --danger: #b3543f;
        --on: #fff;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #15161a;
          --card: #1e2025;
          --ink: #f0efec;
          --sub: #9b9a97;
          --line: #2c2e33;
          --accent: #6fb59e;
          --accent-soft: #233c34;
          --grow: #e0b060;
          --warn: #e6c04a;
          --warn-soft: #3a3420;
          --danger: #e2897a;
          --on: #101418;
        }
      }
      :root[data-theme="dark"] {
        --bg: #15161a;
        --card: #1e2025;
        --ink: #f0efec;
        --sub: #9b9a97;
        --line: #2c2e33;
        --accent: #6fb59e;
        --accent-soft: #233c34;
        --grow: #e0b060;
        --warn: #e6c04a;
        --warn-soft: #3a3420;
        --danger: #e2897a;
        --on: #101418;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }
      header {
        padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 10px;
        background: var(--bg);
        position: sticky;
        top: 0;
        z-index: 5;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 19px;
        margin: 0 0 2px;
        letter-spacing: 0.2px;
      }
      .tag {
        font-size: 12px;
        color: var(--sub);
      }
      .scores {
        display: flex;
        gap: 16px;
        margin-top: 12px;
      }
      .score {
        flex: 1;
      }
      .progress-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 5px;
      }
      .progress-pct {
        font-size: 22px;
        font-weight: 700;
      }
      .progress-label {
        font-size: 11px;
        color: var(--sub);
        letter-spacing: 0.3px;
      }
      .bar-bg {
        height: 8px;
        border-radius: 5px;
        background: var(--line);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 5px;
        transition: width 0.3s ease;
        width: 0%;
      }
      .bld .bar-fill {
        background: var(--grow);
      }

      .days {
        display: flex;
        gap: 6px;
        margin-top: 12px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .day-chip {
        flex: 1;
        min-width: 38px;
        text-align: center;
        padding: 7px 0;
        border-radius: 10px;
        border: 1px solid var(--line);
        font-size: 12px;
        color: var(--sub);
        cursor: pointer;
        user-select: none;
        background: var(--card);
      }
      .day-chip .n {
        display: block;
        font-weight: 700;
        font-size: 13px;
        color: var(--ink);
      }
      .day-chip.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }
      .day-chip.active .n {
        color: var(--accent);
      }
      .day-chip.today {
        box-shadow: 0 0 0 1px var(--accent) inset;
      }

      main,
      #weekMain {
        flex: 1;
        overflow-y: auto;
        padding: 14px 18px 90px;
      }
      #weekMain {
        display: none;
      }
      .layout,
      .pane {
        display: contents;
      }
      .empty {
        color: var(--sub);
        font-size: 13px;
        text-align: center;
        margin-top: 40px;
        line-height: 1.5;
      }
      .block-card {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 9px;
      }
      #main .block-card {
        background: linear-gradient(90deg, var(--card), var(--accent-soft));
      }
      .block-emoji {
        font-size: 20px;
        width: 30px;
        text-align: center;
      }
      .block-name {
        flex: 1;
        font-size: 15px;
        font-weight: 600;
      }
      .sub {
        font-size: 11px;
        color: var(--sub);
        font-weight: 400;
        margin-top: 2px;
      }
      .block-check {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--sub);
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        font-size: 14px;
        color: transparent;
        transition: 0.15s;
      }
      .block-check:not(.done):not(.locked):hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .block-check.done {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on);
      }
      .bld-card .block-check.done {
        background: var(--grow);
        border-color: var(--grow);
      }

      nav.tabs {
        position: sticky;
        bottom: 0;
        display: flex;
        border-top: 1px solid var(--line);
        background: var(--bg);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      nav.tabs button {
        flex: 1;
        padding: 12px 0 10px;
        background: none;
        border: none;
        color: var(--sub);
        font-size: 12px;
        font-family: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      nav.tabs button .ic {
        font-size: 18px;
      }
      nav.tabs button.active {
        color: var(--accent);
        font-weight: 700;
      }

      .section-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--sub);
        margin: 18px 0 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .section-title:first-child {
        margin-top: 0;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
      }

      .setup-row {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 9px;
      }
      .setup-row-top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .setup-row input[type="text"] {
        flex: 1;
        border: none;
        background: none;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        outline: none;
        min-width: 0;
      }
      .emoji-btn {
        width: 38px;
        font-size: 20px;
        border: none;
        background: none;
        padding: 0;
        flex-shrink: 0;
        cursor: pointer;
      }
      .del-btn {
        background: none;
        border: none;
        color: var(--sub);
        font-size: 18px;
        padding: 2px 6px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .pick {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 10px;
      }
      .pick button {
        font-size: 18px;
        background: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 3px 6px;
        cursor: pointer;
      }
      .pick input {
        width: 100%;
        margin-top: 4px;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font-size: 13px;
      }
      .meta {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .meta select {
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font-size: 12px;
      }
      .seg {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg button {
        border: none;
        background: none;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--sub);
        cursor: pointer;
      }
      .seg button.on {
        background: var(--accent);
        color: var(--on);
      }
      .seg button.on.g {
        background: var(--grow);
      }
      .stepper {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--sub);
      }
      .stepper button {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
      }
      .wk-toggle-row {
        display: flex;
        gap: 5px;
        margin-top: 10px;
      }
      .wk-toggle {
        flex: 1;
        text-align: center;
        padding: 5px 0;
        border-radius: 7px;
        font-size: 11px;
        border: 1px solid var(--line);
        color: var(--sub);
        cursor: pointer;
      }
      .wk-toggle.on {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on);
      }
      .hint {
        font-size: 12px;
        color: var(--grow);
        margin: 0 0 10px;
      }

      .add-btn {
        width: 100%;
        padding: 13px;
        border-radius: 14px;
        border: 1.5px dashed var(--line);
        background: none;
        color: var(--accent);
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        margin-top: 4px;
      }
      .day-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }
      .dg-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        padding: 9px 0 8px;
        min-height: 78px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        font-size: 12px;
        color: var(--sub);
        text-align: center;
      }
      .dg-cell .dn {
        font-weight: 700;
        font-size: 17px;
        line-height: 1.2;
        color: var(--ink);
      }
      .dg-cell .df {
        font-weight: 600;
        font-size: 12px;
        color: var(--ink);
      }
      .dg-cell.full {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }
      .dg-cell.full .dn,
      .dg-cell.full .df {
        color: var(--accent);
      }
      .dg-cell.today {
        box-shadow: 0 0 0 1px var(--accent) inset;
      }
      .dg-cell.future {
        opacity: 0.55;
      }
      .dg-cell.future .dn,
      .dg-cell.future .df {
        color: var(--sub);
        font-weight: 500;
      }
      .dg-star {
        border-style: dashed;
        background: transparent;
      }
      .dg-star .stamp {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        font-size: 26px;
        line-height: 1;
        color: var(--line);
        border: 2px dashed var(--line);
      }
      .dg-star.earned {
        border-style: solid;
        border-color: var(--grow);
        background: color-mix(in srgb, var(--grow) 14%, var(--card));
      }
      .dg-star.earned .stamp {
        color: var(--grow);
        border: 3px double var(--grow);
        transform: rotate(-10deg);
        font-size: 28px;
        text-shadow: 0 1px 0 color-mix(in srgb, var(--grow) 40%, transparent);
      }
      .week-detail {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 10px;
      }
      .week-detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 7px 0;
        font-size: 13px;
        border-bottom: 1px solid var(--line);
      }
      .week-detail-row:last-child {
        border-bottom: none;
      }
      .wd-day {
        color: var(--sub);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .wd-frac {
        font-weight: 600;
      }
      .week-detail-row.wd-bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 110px 3.5em;
        gap: 10px;
      }
      .wd-bar .wd-day {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .wd-bar .wd-frac {
        text-align: right;
      }
      .mini {
        height: 6px;
        width: 100%;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
      }
      .mini i {
        display: block;
        height: 100%;
        border-radius: 4px;
      }
      .day-chip.inert {
        cursor: default;
        pointer-events: none;
        opacity: 0.6;
      }
      .weeknav {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
      }
      .weeknav[hidden] {
        display: none;
      }
      .weeknav button {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      .weeknav button:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .wk-label {
        flex: 1;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
      }
      .setup-row-top {
        gap: 8px;
      }
      .setup-row-top .seg {
        flex-shrink: 0;
      }
      .setup-row-top .seg button {
        padding: 5px 7px;
        font-size: 11px;
      }
      body.away nav.tabs button.active {
        color: var(--warn);
      }
      body.away .day-chip.active {
        border-color: var(--warn);
        background: var(--warn-soft);
        color: var(--warn);
      }
      body.away .day-chip.active .n {
        color: var(--warn);
      }
      .backbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 76px);
        display: flex;
        justify-content: center;
        pointer-events: none;
        z-index: 4;
      }
      .backbar button {
        pointer-events: auto;
        padding: 12px 22px;
        border-radius: 999px;
        border: none;
        background: var(--accent);
        color: var(--on);
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      }
      .seg button.on.n {
        background: var(--line);
        color: var(--ink);
        font-weight: 700;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 20;
      }
      .dlg {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        width: 100%;
        max-width: 320px;
      }
      .dlg-t {
        font-weight: 700;
        font-size: 16px;
        margin-bottom: 6px;
      }
      .dlg .sub {
        font-size: 13px;
        margin: 0 0 16px;
        line-height: 1.4;
      }
      .dlg-b {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .dlg-b button {
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      .dlg-b .danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
      .zone {
        margin-top: 18px;
      }
      .grip {
        width: 16px;
        text-align: center;
        color: var(--sub);
        font-size: 18px;
        line-height: 1;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        flex-shrink: 0;
      }
      .setup-row-top .emoji-btn {
        width: 30px;
      }
      .setup-row.dragging {
        z-index: 30;
        margin: 0;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      .ph {
        border: 1.5px dashed var(--accent);
        border-radius: 14px;
        margin-bottom: 9px;
        background: var(--accent-soft);
        opacity: 0.7;
      }
      .list:empty {
        border: 1.5px dashed var(--line);
        border-radius: 14px;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sub);
        font-size: 12px;
      }
      .list:empty::before {
        content: "Drag a block here";
      }
      .cat-input {
        flex: 1;
        min-width: 0;
        border: none;
        background: none;
        outline: none;
        font: inherit;
        text-transform: inherit;
        letter-spacing: inherit;
        color: inherit;
        padding: 0;
      }
      .add-section {
        margin-top: 26px;
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .add-title {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .add-section .sub {
        font-size: 13px;
        line-height: 1.45;
        margin: 0 0 14px;
      }
      .main-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 14px;
        background: var(--accent);
        color: var(--on);
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      }
      .main-btn:active {
        transform: translateY(1px);
      }
      .data-row {
        display: flex;
        justify-content: space-between;
        margin: 24px 4px 12px;
      }
      .data-row .link-btn {
        display: inline-block;
        margin: 0;
        padding: 10px 6px;
        opacity: 0.7;
      }
      .link-btn {
        display: block;
        margin: 12px auto 0;
        background: none;
        border: none;
        color: var(--sub);
        font-size: 12px;
        font-family: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      .dlg textarea {
        width: 100%;
        height: 130px;
        margin-bottom: 14px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font:
          11px/1.4 ui-monospace,
          Menlo,
          monospace;
        resize: none;
      }
      .dlg input.nm {
        width: 100%;
        margin: 6px 0 14px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        font-size: 16px;
      }
      .dlg-b .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on);
      }
      @media (min-width: 900px) {
        body {
          max-width: 1100px;
          width: 100%;
          margin: 0 auto;
        }
        header {
          padding-left: 24px;
          padding-right: 24px;
        }
        .layout {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 420px;
          grid-template-rows: minmax(0, 1fr);
          flex: 1;
          min-height: 0;
        }
        .pane {
          display: flex;
          flex-direction: column;
          min-height: 0;
          min-width: 0;
        }
        .left {
          position: relative;
          border-right: 1px solid var(--line);
        }
        main,
        #weekMain {
          display: block;
          padding: 18px 24px 40px;
          min-height: 0;
        }
        nav.tabs {
          position: static;
          border-top: none;
          border-bottom: 1px solid var(--line);
          padding-bottom: 0;
          flex-shrink: 0;
        }
        nav.tabs button {
          flex-direction: row;
          justify-content: center;
          gap: 8px;
          padding: 13px 0;
        }
        nav.tabs button[data-tab="week"] {
          display: none;
        }
        .backbar {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 20px;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      .hrow {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .gear {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--sub);
        font-size: 18px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .seg.wide {
        width: 100%;
      }
      .seg.wide button {
        flex: 1;
        padding: 8px 0;
        font-size: 13px;
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .sw {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        padding: 0;
        cursor: pointer;
        box-shadow: 0 0 0 1px var(--line) inset;
      }
      .sw.sel {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .sw.custom {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--card);
        color: var(--sub);
        font-size: 18px;
        overflow: visible;
      }
      .sw.custom input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      .setup-row.ro {
        opacity: 0.7;
      }
      .setup-row.ro input,
      .setup-row.ro .seg,
      .setup-row.ro .wk-toggle,
      .setup-row.ro .stepper button,
      .setup-row.ro .grip,
      .setup-row.ro .del-btn,
      .setup-row.ro .emoji-btn {
        pointer-events: none;
      }
      .block-check.locked {
        pointer-events: none;
        opacity: 0.55;
        border: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="hrow">
        <div>
          <h1>Daily Rhythm</h1>
          <div class="tag" id="dateLabel">—</div>
        </div>
        <button class="gear" id="gear" aria-label="Appearance" title="Appearance">◐</button>
      </div>
      <div class="scores">
        <div class="score">
          <div class="progress-top">
            <span class="progress-pct" id="pctE">0%</span><span class="progress-label">Established</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" id="barE"></div></div>
        </div>
        <div class="score bld">
          <div class="progress-top">
            <span class="progress-pct" id="pctB">—</span><span class="progress-label">Building</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" id="barB"></div></div>
        </div>
      </div>
      <div class="days" id="dayChips"></div>
      <div class="weeknav" id="weekbar" hidden></div>
    </header>

    <div class="layout">
      <section class="pane left"><main id="main"></main></section>
      <section class="pane right">
        <div id="weekMain"></div>
      </section>
    </div>

    <nav class="tabs">
      <button data-tab="today" class="active"><span class="ic">✓</span>Today</button>
      <button data-tab="blocks"><span class="ic">▦</span>Blocks</button>
      <button data-tab="week"><span class="ic">◔</span>Week</button>
    </nav>

    <script>
      const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const KEYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
      const WEEKDAYS = ["mon", "tue", "wed", "thu", "fri"];
      const EMOJIS = [
        "📚",
        "💼",
        "🎨",
        "🚶",
        "🧘",
        "🏋️",
        "🍳",
        "💤",
        "🍎",
        "💧",
        "🏃",
        "🚴",
        "🧠",
        "🙏",
        "🕯️",
        "📖",
        "✍️",
        "💻",
        "🎯",
        "🎵",
        "📷",
        "🌱",
        "👥",
        "🤝",
        "☎️",
        "💌",
        "🏡",
        "🧹",
        "💰",
        "🧾",
        "📅",
        "🔧",
        "☀️",
        "🌙",
        "⭐",
        "❤️"
      ];
      const $ = (s) => document.querySelector(s);

      function h(tag, props = {}, kids = []) {
        const e = document.createElement(tag);
        for (const k in props) {
          if (k === "class") e.className = props[k];
          else if (k === "text") e.textContent = props[k];
          else if (k === "style") e.style.cssText = props[k];
          else e[k] = props[k];
        }
        [].concat(kids).forEach((c) => {
          if (c != null) e.append(c);
        });
        return e;
      }

      /* ---------- appearance ---------- */
      const PK = "rhythm_prefs";
      const SWATCHES = ["#2f6f5e", "#3b6fb6", "#6a5acd", "#b04f7a", "#c2603f", "#2a8f9e", "#5d6b7a", "#7a8f2f"];
      let prefs = { theme: "auto", color: "#2f6f5e" };
      try {
        Object.assign(prefs, JSON.parse(localStorage.getItem(PK) || "{}"));
      } catch (e) {}
      const dmq = window.matchMedia("(prefers-color-scheme: dark)");
      function savePrefs() {
        try {
          localStorage.setItem(PK, JSON.stringify(prefs));
        } catch (e) {}
      }
      function hexToHsl(hex) {
        const r = parseInt(hex.slice(1, 3), 16) / 255,
          g = parseInt(hex.slice(3, 5), 16) / 255,
          b = parseInt(hex.slice(5, 7), 16) / 255;
        const mx = Math.max(r, g, b),
          mn = Math.min(r, g, b),
          d = mx - mn,
          l = (mx + mn) / 2;
        let hh = 0,
          sat = 0;
        if (d) {
          sat = d / (1 - Math.abs(2 * l - 1));
          hh = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
          hh = (hh * 60 + 360) % 360;
        }
        return [hh, sat * 100, l * 100];
      }
      function applyPrefs() {
        const dark = prefs.theme === "dark" || (prefs.theme === "auto" && dmq.matches);
        const root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        const [hh, sat, l] = hexToHsl(prefs.color),
          S = Math.round(Math.min(sat, 70));
        root.style.setProperty(
          "--accent",
          dark
            ? `hsl(${Math.round(hh)}, ${Math.min(S, 55)}%, ${Math.round(Math.max(l, 64))}%)`
            : `hsl(${Math.round(hh)}, ${S}%, ${Math.round(Math.min(l, 38))}%)`
        );
        root.style.setProperty(
          "--accent-soft",
          dark ? `hsl(${Math.round(hh)}, 28%, 18%)` : `hsl(${Math.round(hh)}, 38%, 90%)`
        );
      }
      dmq.addEventListener("change", () => {
        if (prefs.theme === "auto") applyPrefs();
      });
      applyPrefs();

      function openSettings() {
        const close = () => ov.remove();
        const dlg = h("div", { class: "dlg", role: "dialog" });
        const ov = h(
          "div",
          {
            class: "ov",
            onclick: (e) => {
              if (e.target === ov) close();
            }
          },
          dlg
        );
        const set = (k, v) => {
          prefs[k] = v;
          savePrefs();
          applyPrefs();
          draw();
        };
        const draw = () => {
          const custom = !SWATCHES.includes(prefs.color);
          dlg.replaceChildren(
            h("div", { class: "dlg-t", text: "Appearance" }),
            h("div", { class: "sub", style: "margin:0 0 8px", text: "Theme" }),
            h(
              "div",
              { class: "seg wide" },
              ["auto", "light", "dark"].map((t) =>
                h("button", {
                  class: prefs.theme === t ? "on" : "",
                  text: t[0].toUpperCase() + t.slice(1),
                  onclick: () => set("theme", t)
                })
              )
            ),
            h("div", { class: "sub", style: "margin:18px 0 10px", text: "Main color" }),
            h(
              "div",
              { class: "swatches" },
              SWATCHES.map((c) =>
                h("button", {
                  class: "sw" + (prefs.color === c ? " sel" : ""),
                  style: "background:" + c,
                  ariaLabel: c,
                  onclick: () => set("color", c)
                })
              ).concat(
                h(
                  "label",
                  {
                    class: "sw custom" + (custom ? " sel" : ""),
                    style: custom ? "background:" + prefs.color : "",
                    title: "Custom color"
                  },
                  [
                    custom ? "" : "+",
                    h("input", {
                      type: "color",
                      value: prefs.color,
                      oninput: (e) => {
                        prefs.color = e.target.value;
                        savePrefs();
                        applyPrefs();
                      },
                      onchange: () => draw()
                    })
                  ]
                )
              )
            ),
            h(
              "div",
              { class: "dlg-b", style: "margin-top:20px" },
              h("button", { class: "primary", text: "Done", onclick: close })
            )
          );
        };
        draw();
        document.body.append(ov);
      }
      $("#gear").onclick = openSettings;

      /* ---------- state ---------- */
      function isoDate(d) {
        const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0, 10);
      }
      const todayISO = () => isoDate(new Date());
      const dowKey = (d) => KEYS[(d.getDay() + 6) % 7];

      function defCats() {
        return [
          { id: "body", name: "Body", color: "#d98b5f" },
          { id: "mind", name: "Mind", color: "#7f9fd6" },
          { id: "build", name: "Build", color: "#2f9f7e" },
          { id: "connect", name: "Connect", color: "#d9739b" },
          { id: "maintain", name: "Maintain", color: "#b0a07a" }
        ];
      }
      const K3 = "rhythm_app_v3";
      const pd = (x) => new Date(x + "T00:00:00");
      const wkKey = (d) => isoDate(startOfWeek(typeof d === "string" ? pd(d) : d));
      const sch = (days) => ({ mode: "days", days });
      const cnt = (n) => ({ mode: "count", perWeek: n });
      function mk(id, name, emoji, cat, stage, schedule, from) {
        return { id, name, emoji, versions: [{ from, cat, stage, schedule }] };
      }
      function fresh() {
        const f = wkKey(todayISO());
        return {
          meta: { schema: 3, startedOn: todayISO() },
          cats: defCats(),
          blocks: [
            mk("b1790722665902", "Connect with a Friend", "☎️", "connect", "building", cnt(3), f),
            mk("b1790722660583", "Clean Home", "🧽", "maintain", "established", sch(["sat", "sun"]), f),
            mk("b4", "Walk", "🚶", "body", "established", sch(KEYS.slice()), f),
            mk("b1", "Study", "📚", "build", "building", cnt(2), f),
            mk("b3", "Create", "🎨", "mind", "established", sch(["tue", "thu", "sat"]), f)
          ],
          log: {}
        };
      }
      function loadState() {
        try {
          const r = localStorage.getItem(K3);
          if (r) return JSON.parse(r);
        } catch (e) {
          console.warn("storage read failed", e);
        }
        return fresh();
      }
      function saveState() {
        try {
          localStorage.setItem(K3, JSON.stringify(state));
        } catch (e) {
          console.warn("storage write failed", e);
        }
      }

      let state = loadState();
      let activeTab = "today";
      let viewDate = new Date();
      let pickId = null;

      const byId = (id) => state.blocks.find((b) => b.id === id);

      /* ---------- dates ---------- */
      function startOfWeek(d) {
        const nd = new Date(d);
        nd.setDate(nd.getDate() - ((nd.getDay() + 6) % 7));
        nd.setHours(0, 0, 0, 0);
        return nd;
      }
      function weekDates(d) {
        const s = startOfWeek(d);
        return Array.from({ length: 7 }, (_, i) => {
          const x = new Date(s);
          x.setDate(s.getDate() + i);
          return x;
        });
      }
      const fmtDateLabel = (d) => d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });

      /* ---------- plan history: blocks have dated versions; a week uses the latest version on or before its Monday ---------- */
      const thisWk = () => wkKey(new Date());
      const nextWk = () => wkKey(new Date(Date.now() + 7 * 864e5));
      const inSetup = () => thisWk() === wkKey(state.meta.startedOn);
      const minEditWk = () => (inSetup() ? thisWk() : nextWk());
      /* the week edits land in: the week being viewed on the Blocks tab (any future week), otherwise the earliest editable week */
      const editWk = () => {
        const v = wkKey(viewDate);
        return activeTab === "blocks" && v > minEditWk() ? v : minEditWk();
      };
      function specAt(b, wk) {
        if (b.retiredFrom && b.retiredFrom <= wk) return null;
        let s = null;
        b.versions.forEach((v) => {
          if (v.from <= wk && (!s || v.from >= s.from)) s = v;
        });
        return s;
      }
      const at = (b, wk) => {
        const s = specAt(b, wk);
        return s && { ...b, ...s };
      };
      function editSpec(b, patch) {
        const wk = editWk();
        let v = b.versions.find((x) => x.from === wk);
        if (!v) {
          v = JSON.parse(JSON.stringify(specAt(b, wk) || b.versions[0]));
          v.from = wk;
          b.versions.push(v);
        }
        Object.assign(v, patch);
        b.versions.sort((x, y) => (x.from < y.from ? -1 : 1));
      }
      function mut(fn) {
        fn();
        saveState();
        renderAll();
      }

      /* ---------- stats ---------- */
      function weekStats(ref) {
        const wk = wkKey(ref),
          t = new Date();
        t.setHours(0, 0, 0, 0);
        const dates = weekDates(ref),
          start = state.meta.startedOn;
        const elig = dates.filter((d) => isoDate(d) >= start),
          past = elig.filter((d) => d <= t);
        const ok = (d, id) => !!(state.log[isoDate(d)] || { done: {} }).done[id];
        const o = { p: 0, dn: 0, cats: {}, byId: {}, items: [], counts: [] };
        const perDay = dates.map((d) => (d > t ? { d, future: true } : { d, p: 0, dd: 0 }));
        let bt = 0,
          bn = 0;
        state.blocks.forEach((raw) => {
          const b = at(raw, wk);
          if (!b) return;
          const s = b.schedule;
          let due, n, tot;
          if (s.mode === "count") {
            due = Math.min(s.perWeek, elig.length);
            tot = past.filter((d) => ok(d, b.id)).length;
            n = Math.min(due, tot);
          } else {
            const ds = past.filter((d) => s.days.includes(dowKey(d)));
            due = ds.length;
            n = ds.filter((d) => ok(d, b.id)).length;
            if (b.stage === "established")
              ds.forEach((d) => {
                const x = perDay[dates.indexOf(d)];
                x.p++;
                if (ok(d, b.id)) x.dd++;
              });
          }
          if (tot == null) tot = n;
          o.byId[b.id] = { n, due, raw: tot };
          if (b.stage === "building") {
            o.items.push({ b, n, due, raw: tot });
            bt += due;
            bn += n;
          } else {
            if (s.mode === "count") o.counts.push({ b, n, due, raw: tot });
            o.p += due;
            o.dn += n;
            const c = o.cats[b.cat] || (o.cats[b.cat] = { p: 0, d: 0 });
            c.p += due;
            c.d += n;
          }
        });
        return {
          ...o,
          perDay,
          pct: o.p ? Math.round((100 * o.dn) / o.p) : 0,
          bpct: bt ? Math.round((100 * bn) / bt) : null
        };
      }
      function weeksIn(b, wk) {
        let from = null;
        const vs = b.versions.filter((v) => v.from <= wk);
        for (let i = vs.length - 1; i >= 0 && vs[i].stage === "building"; i--) from = vs[i].from;
        return from ? Math.round((pd(wk) - pd(from)) / (7 * 864e5)) + 1 : 0;
      }
      function g1(s) {
        s = s.trim();
        if (!s) return "";
        return window.Intl && Intl.Segmenter ? [...new Intl.Segmenter().segment(s)][0].segment : Array.from(s)[0];
      }

      /* ---------- render ---------- */
      function renderHeader() {
        $("#dateLabel").textContent = fmtDateLabel(new Date());
        const w = weekStats(viewDate);
        $("#pctE").textContent = w.pct + "%";
        $("#barE").style.width = w.pct + "%";
        $("#pctB").textContent = w.bpct == null ? "—" : w.bpct + "%";
        $("#barB").style.width = (w.bpct || 0) + "%";
        const chips = $("#dayChips");
        chips.style.display = desk() || activeTab === "today" ? "" : "none";
        chips.innerHTML = "";
        const tIso = todayISO(),
          vIso = isoDate(viewDate);
        const pickable = activeTab === "today";
        weekDates(viewDate).forEach((d, i) => {
          const iso = isoDate(d);
          const props = {
            class:
              "day-chip" +
              (pickable && iso === vIso ? " active" : "") +
              (iso === tIso ? " today" : "") +
              (pickable ? "" : " inert")
          };
          if (pickable)
            props.onclick = () => {
              viewDate = d;
              renderAll();
            };
          chips.append(h("div", props, [DOW[i][0], h("span", { class: "n", text: d.getDate() })]));
        });
        const away = activeTab === "today" && vIso !== tIso;
        document.body.classList.toggle("away", away);
      }

      function card(b, iso, sub, cls) {
        const L = state.log[iso];
        const done = !!(L && L.done[b.id]);
        return h("div", { class: "block-card " + (cls || "") }, [
          h("div", { class: "block-emoji", text: b.emoji }),
          h("div", { class: "block-name" }, [b.name, sub ? h("div", { class: "sub", text: sub }) : null]),
          h("div", {
            class: "block-check" + (done ? " done" : "") + (wkKey(iso) < thisWk() || iso > todayISO() ? " locked" : ""),
            text: "✓",
            onclick: () => {
              if (wkKey(iso) < thisWk() || iso > todayISO()) return;
              const l = state.log[iso] || (state.log[iso] = { done: {} });
              l.done[b.id] = !l.done[b.id];
              saveState();
              renderAll();
            }
          })
        ]);
      }

      function backBar() {
        if (isoDate(viewDate) === todayISO()) return;
        $("#main").append(
          h(
            "div",
            { class: "backbar" },
            h("button", {
              text: "↩ Back to today",
              onclick: () => {
                viewDate = new Date();
                renderAll();
              }
            })
          )
        );
      }

      function renderToday() {
        const main = $("#main");
        main.innerHTML = "";
        const iso = isoDate(viewDate),
          wk = wkKey(viewDate),
          k = dowKey(viewDate);
        const w = weekStats(viewDate);
        const due = state.blocks
          .map((b) => at(b, wk))
          .filter((b) => b && (b.schedule.mode === "count" || b.schedule.days.includes(k)));
        if (!due.length) {
          main.append(
            h("div", {
              class: "empty",
              innerHTML: "Nothing planned for this day yet.<br>Add blocks in the Blocks tab."
            })
          );
          backBar();
          return;
        }
        const prog = (b) => {
          const x = w.byId[b.id];
          return b.schedule.mode === "count" && x ? `${x.raw}/${x.due} this week` : "";
        };
        state.cats.forEach((c) => {
          const items = due.filter((b) => b.stage === "established" && b.cat === c.id);
          if (!items.length) return;
          main.append(
            h("div", { class: "section-title" }, [h("span", { class: "dot", style: "background:" + c.color }), c.name])
          );
          items.forEach((b) => main.append(card(b, iso, prog(b))));
        });
        const bld = due.filter((b) => b.stage === "building");
        if (bld.length) {
          main.append(h("div", { class: "section-title", style: "color:var(--grow)" }, "Building"));
          bld.forEach((b) => {
            const n = weeksIn(b, wk),
              p = prog(b);
            main.append(
              card(b, iso, (p ? p + " · " : "") + `week ${n}` + (n > 4 ? " · ready to promote?" : ""), "bld-card")
            );
          });
        }
        backBar();
      }

      function editText(title, cur, apply) {
        if (document.querySelector(".dlg input.nm")) return;
        const close = () => ov.remove();
        const save = () => {
          const v = inp.value.trim();
          close();
          if (v && v !== cur) apply(v);
        };
        const inp = h("input", {
          type: "text",
          class: "nm",
          value: cur,
          onkeydown: (e) => {
            if (e.key === "Enter") save();
            if (e.key === "Escape") close();
          }
        });
        const ov = h(
          "div",
          { class: "ov", onclick: (e) => e.target === ov && close() },
          h("div", { class: "dlg", role: "dialog" }, [
            h("div", { class: "dlg-t", text: title }),
            inp,
            h("div", { class: "dlg-b" }, [
              h("button", { text: "Cancel", onclick: close }),
              h("button", { class: "primary", text: "Save", onclick: save })
            ])
          ])
        );
        document.body.append(ov);
        inp.focus();
        inp.select();
      }

      const editName = (b) => editText("Block name", b.name, (v) => mut(() => (b.name = v)));

      function confirmRemove(b) {
        const close = () => ov.remove();
        const ov = h(
          "div",
          {
            class: "ov",
            onclick: (e) => {
              if (e.target === ov) close();
            }
          },
          h("div", { class: "dlg", role: "dialog" }, [
            h("div", { class: "dlg-t", text: `Remove “${b.name}”?` }),
            h("p", { class: "sub", text: "Remove from your plan. Does not affect stats from past weeks." }),
            h("div", { class: "dlg-b" }, [
              h("button", { text: "Cancel", onclick: close }),
              h("button", {
                class: "danger",
                text: "Remove",
                onclick: () => {
                  close();
                  mut(() => {
                    const wk = editWk();
                    if (b.versions[0].from >= wk) state.blocks = state.blocks.filter((x) => x.id !== b.id);
                    else {
                      b.retiredFrom = wk;
                      b.versions = b.versions.filter((v) => v.from < wk);
                    }
                  });
                }
              })
            ])
          ])
        );
        document.body.append(ov);
      }

      function startDrag(e, row, b) {
        if (e.button > 0) return;
        e.preventDefault();
        const main = $("#main"),
          grip = e.currentTarget,
          r = row.getBoundingClientRect();
        const ph = h("div", { class: "ph", style: `height:${r.height}px` });
        row.parentNode.insertBefore(ph, row);
        row.classList.add("dragging");
        row.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;`;
        const offY = e.clientY - r.top;
        let lastY = e.clientY,
          sy = 0,
          on = true;
        grip.setPointerCapture(e.pointerId);

        const place = (y) => {
          row.style.top = y - offY + "px";
          let best = null,
            bd = Infinity;
          document.querySelectorAll(".zone").forEach((z) => {
            const q = z.getBoundingClientRect();
            const d = y < q.top ? q.top - y : y > q.bottom ? y - q.bottom : 0;
            if (d < bd) {
              bd = d;
              best = z;
            }
          });
          const list = best.querySelector(".list");
          const next = [...list.querySelectorAll(":scope > .setup-row")]
            .filter((x) => x !== row)
            .find((x) => {
              const q = x.getBoundingClientRect();
              return y < q.top + q.height / 2;
            });
          if (next) list.insertBefore(ph, next);
          else list.append(ph);
        };
        const move = (ev) => {
          lastY = ev.clientY;
          place(lastY);
          const q = main.getBoundingClientRect();
          sy = lastY < q.top + 70 ? -8 : lastY > q.bottom - 70 ? 8 : 0;
        };
        const loop = () => {
          if (!on) return;
          if (sy) {
            main.scrollTop += sy;
            place(lastY);
          }
          requestAnimationFrame(loop);
        };
        const end = (ev) => {
          on = false;
          grip.removeEventListener("pointermove", move);
          grip.removeEventListener("pointerup", end);
          grip.removeEventListener("pointercancel", end);
          if (ev.type === "pointercancel") {
            renderAll();
            return;
          }
          let n = ph.nextElementSibling;
          while (n === row) n = n.nextElementSibling;
          const cat = ph.closest(".zone").dataset.cat;
          state.blocks = state.blocks.filter((x) => x !== b);
          const wk = editWk(),
            catOf = (x) => (specAt(x, wk) || {}).cat;
          if (catOf(b) !== cat) editSpec(b, { cat });
          if (n) {
            state.blocks.splice(
              state.blocks.findIndex((x) => x.id === n.dataset.id),
              0,
              b
            );
          } else {
            let last = -1;
            state.blocks.forEach((x, i) => {
              if (catOf(x) === cat) last = i;
            });
            state.blocks.splice(last + 1, 0, b);
          }
          saveState();
          renderAll();
        };
        grip.addEventListener("pointermove", move);
        grip.addEventListener("pointerup", end);
        grip.addEventListener("pointercancel", end);
        requestAnimationFrame(loop);
      }

      function blockRow(r, edit, wk) {
        const b = byId(r.id),
          s = r.schedule;
        const row = h("div", { class: "setup-row" + (edit ? "" : " ro") });
        row.dataset.id = b.id;
        const set = (p) => mut(() => editSpec(b, p));
        const seg = (opts) =>
          h(
            "div",
            { class: "seg" },
            opts.map(([t, on, cls, fn]) => h("button", { class: on ? "on " + cls : "", text: t, onclick: fn }))
          );
        const grip = h("div", { class: "grip", text: "⠿", title: "Drag to reorder or move to another category" });
        if (edit) grip.onpointerdown = (e) => startDrag(e, row, b);
        row.append(
          h("div", { class: "setup-row-top" }, [
            grip,
            h("button", {
              class: "emoji-btn",
              text: r.emoji,
              onclick: () => {
                pickId = pickId === b.id ? null : b.id;
                renderAll();
              }
            }),
            h("input", {
              type: "text",
              value: r.name,
              readOnly: !edit,
              onfocus: (e) => {
                if (edit && !desk()) {
                  e.target.blur();
                  editName(b);
                }
              },
              oninput: (e) => {
                b.name = e.target.value;
                saveState();
              }
            }),
            seg([
              ["Building", r.stage === "building", "g", () => r.stage !== "building" && set({ stage: "building" })],
              [
                "Established",
                r.stage === "established",
                "n",
                () => r.stage !== "established" && set({ stage: "established" })
              ]
            ]),
            h("button", { class: "del-btn", text: "✕", onclick: () => confirmRemove(b) })
          ])
        );
        if (pickId === b.id && edit) {
          const setE = (em) => {
            if (!em) return;
            b.emoji = em;
            pickId = null;
            saveState();
            renderAll();
          };
          const custom = h("input", {
            type: "text",
            placeholder: "Or type your own emoji, then press Enter",
            onkeydown: (e) => {
              if (e.key === "Enter") setE(g1(e.target.value));
            }
          });
          row.append(
            h(
              "div",
              { class: "pick" },
              EMOJIS.map((em) => h("button", { text: em, onclick: () => setE(em) })).concat(custom)
            )
          );
        }
        row.append(
          h(
            "div",
            { class: "meta" },
            seg([
              [
                "Specific days",
                s.mode === "days",
                "n",
                () => s.mode !== "days" && set({ schedule: sch(WEEKDAYS.slice()) })
              ],
              ["× per week", s.mode === "count", "n", () => s.mode !== "count" && set({ schedule: cnt(3) })]
            ])
          )
        );
        if (s.mode === "count") {
          const step = (n) => set({ schedule: cnt(Math.max(1, Math.min(7, s.perWeek + n))) });
          row.append(
            h(
              "div",
              { class: "meta" },
              h("div", { class: "stepper" }, [
                "Target",
                h("button", { text: "−", onclick: () => step(-1) }),
                h("b", { text: s.perWeek + "× / week", style: "color:var(--ink)" }),
                h("button", { text: "+", onclick: () => step(1) })
              ])
            )
          );
        } else {
          const tr = h("div", { class: "wk-toggle-row" });
          KEYS.forEach((dk, i) =>
            tr.append(
              h("div", {
                class: "wk-toggle" + (s.days.includes(dk) ? " on" : ""),
                text: DOW[i][0],
                onclick: () =>
                  set({ schedule: sch(s.days.includes(dk) ? s.days.filter((x) => x !== dk) : s.days.concat(dk)) })
              })
            )
          );
          row.append(tr);
        }
        if (edit && !inSetup() && b.versions.some((v) => v.from === wk))
          row.append(
            h("div", {
              class: "sub",
              text: "Starts Monday " + pd(wk).toLocaleDateString(undefined, { month: "short", day: "numeric" })
            })
          );
        return row;
      }

      function renderBlocks() {
        const main = $("#main");
        main.innerHTML = "";
        const wk = wkKey(viewDate),
          edit = wk >= minEditWk();
        const f = (x) => pd(x).toLocaleDateString(undefined, { month: "short", day: "numeric" });
        main.append(
          h("p", {
            class: "hint",
            style: "margin:0 0 8px",
            text: edit
              ? inSetup() && wk === thisWk()
                ? "Setup week: changes apply right away."
                : `Changes you make here start Monday ${f(wk)} and carry on from there, until a later week changes them.`
              : wk < thisWk()
                ? `The plan in effect the week of ${f(wk)}. Past weeks are read-only.`
                : "This week’s plan is locked. Use › to plan ahead."
          })
        );
        if (edit)
          main.append(
            h("div", {
              class: "sub",
              style: "margin-bottom:2px",
              text: "Drag ⠿ to reorder blocks or move them between categories."
            })
          );
        const res = state.blocks.map((b) => at(b, wk)).filter(Boolean);
        const tooManyBuilding = res.filter((r) => r.stage === "building").length > 2;
        state.cats.forEach((c) => {
          const zone = h("div", { class: "zone" });
          zone.dataset.cat = c.id;
          zone.append(
            h("div", { class: "section-title" }, [
              h("span", { class: "dot", style: "background:" + c.color }),
              h("input", {
                type: "text",
                class: "cat-input",
                value: c.name,
                onfocus: (e) => {
                  if (!desk()) {
                    e.target.blur();
                    editText("Category name", c.name, (v) => mut(() => (c.name = v)));
                  }
                },
                oninput: (e) => {
                  c.name = e.target.value;
                  saveState();
                }
              })
            ])
          );
          const list = h("div", { class: "list" });
          res.filter((r) => r.cat === c.id).forEach((r) => list.append(blockRow(r, edit, wk)));
          zone.append(list);
          main.append(zone);
        });
        main.append(
          h("div", { class: "add-section" }, [
            edit ? h("div", { class: "add-title", text: "Add a block" }) : null,
            edit
              ? h("p", {
                  class: "sub",
                  text: "A block is anything you want to show up for each week. New blocks start in Building with a weekly target. Each block can run on specific days or a number of times per week."
                })
              : null,
            edit && tooManyBuilding
              ? h("p", {
                  class: "hint",
                  style: "margin:0 0 12px",
                  text: "3+ habits in Building at once splits your focus. Consider promoting one to Established or waiting until next week."
                })
              : null,
            edit ? h("button", { class: "main-btn", text: "+ Add block", onclick: addBlock }) : null
          ])
        );
        main.append(
          h("div", { class: "data-row" }, [
            h("button", { class: "link-btn", text: "Import data", onclick: importData }),
            h("button", { class: "link-btn", text: "Export data", onclick: showExport })
          ])
        );
      }

      function addBlock() {
        const id = "b" + Date.now();
        mut(() => {
          state.blocks.push({
            id,
            name: "New habit",
            emoji: "🌱",
            versions: [{ from: editWk(), cat: "build", stage: "building", schedule: cnt(2) }]
          });
        });
        const r = document.querySelector(`.setup-row[data-id="${id}"]`);
        if (r) {
          r.scrollIntoView({ block: "center" });
          if (desk()) {
            const i = r.querySelector("input[type=text]");
            i.focus();
            i.select();
          } else editName(byId(id));
        }
      }

      function importData() {
        const inp = h("input", { type: "file", accept: "application/json,.json", style: "display:none" });
        inp.onchange = async () => {
          const f = inp.files[0];
          inp.remove();
          if (!f) return;
          let o;
          try {
            o = JSON.parse(await f.text());
            const ok =
              o &&
              o.meta &&
              o.meta.startedOn &&
              Array.isArray(o.cats) &&
              Array.isArray(o.blocks) &&
              o.log &&
              typeof o.log === "object";
            if (!ok || !o.blocks.every((b) => b.id && Array.isArray(b.versions) && b.versions.length)) throw 0;
          } catch (e) {
            alert("That file doesn’t look like a Rhythm export.");
            return;
          }
          const close = () => ov.remove();
          const ov = h(
            "div",
            { class: "ov", onclick: (e) => e.target === ov && close() },
            h("div", { class: "dlg", role: "dialog" }, [
              h("div", { class: "dlg-t", text: "Replace all your data?" }),
              h("p", {
                class: "sub",
                text: `This swaps everything in the app for the contents of ${f.name}. Export first if you want a backup of what’s here now.`
              }),
              h("div", { class: "dlg-b" }, [
                h("button", { text: "Cancel", onclick: close }),
                h("button", {
                  class: "primary",
                  text: "Replace",
                  onclick: () => {
                    close();
                    state = { meta: o.meta, cats: o.cats, blocks: o.blocks, log: o.log };
                    viewDate = new Date();
                    saveState();
                    renderAll();
                  }
                })
              ])
            ])
          );
          document.body.append(ov);
        };
        document.body.append(inp);
        inp.click();
      }

      function showExport() {
        const blob = new Blob([JSON.stringify({ app: "rhythm", exportedOn: todayISO(), ...state }, null, 2)], {
          type: "application/json"
        });
        const a = h("a", { href: URL.createObjectURL(blob), download: `rhythm-data-${todayISO()}.json` });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      function barRow(label, right, pct, color, dot) {
        return h("div", { class: "week-detail-row wd-bar" }, [
          h("span", { class: "wd-day" }, [dot ? h("span", { class: "dot", style: "background:" + dot }) : null, label]),
          h("div", { class: "mini" }, h("i", { style: `width:${pct}%;background:${color}` })),
          h("span", { class: "wd-frac", text: right })
        ]);
      }

      const weekLabel = (wk) => {
        const n = Math.round((pd(wk) - pd(thisWk())) / (7 * 864e5));
        return n === 0 ? "This week" : n === 1 ? "Next week" : `In ${n} weeks`;
      };
      const weekLimit = () =>
        activeTab === "blocks" ? pd(thisWk()).getTime() + 52 * 7 * 864e5 : startOfWeek(new Date()).getTime();
      function shiftWeek(n) {
        const nd = new Date(viewDate);
        nd.setDate(nd.getDate() + 7 * n);
        const cur = startOfWeek(new Date()).getTime();
        if (startOfWeek(nd).getTime() > weekLimit()) return;
        viewDate = startOfWeek(nd).getTime() === cur ? new Date() : nd;
        renderAll();
      }
      function weekNav() {
        const ds = weekDates(viewDate),
          f = (d) => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
        const isCur = startOfWeek(viewDate).getTime() >= weekLimit();
        return h("div", { class: "weeknav" }, [
          h("button", { text: "‹", ariaLabel: "Previous week", onclick: () => shiftWeek(-1) }),
          h("div", { class: "wk-label" }, [
            f(ds[0]) + " – " + f(ds[6]),
            wkKey(viewDate) >= thisWk() ? h("div", { class: "sub", text: weekLabel(wkKey(viewDate)) }) : null
          ]),
          h("button", { text: "›", ariaLabel: "Next week", disabled: isCur, onclick: () => shiftWeek(1) })
        ]);
      }

      function renderWeek(main) {
        main.innerHTML = "";
        const w = weekStats(viewDate);

        main.append(h("div", { class: "section-title", text: "Established · day by day" }));
        const box = h("div", { class: "week-detail" });
        const grid = h("div", { class: "day-grid" });
        const tIso = todayISO();
        w.perDay.forEach((x, i) => {
          const full = !x.future && x.dd === x.p;
          grid.append(
            h(
              "div",
              {
                class:
                  "dg-cell" +
                  (full ? " full" : "") +
                  (x.future ? " future" : "") +
                  (isoDate(x.d) === tIso ? " today" : "")
              },
              [
                DOW[i][0],
                h("span", { class: "dn", text: x.d.getDate() }),
                h("span", { class: "df", text: x.future ? "–" : x.p ? x.dd + "/" + x.p : "—" })
              ]
            )
          );
        });
        // Gold star: every day is in the past/today and every scheduled day was fully completed
        const earned = w.perDay.every((x) => !x.future && x.dd === x.p) && w.perDay.some((x) => x.p > 0);
        grid.append(
          h(
            "div",
            {
              class: "dg-cell dg-star" + (earned ? " earned" : ""),
              title: earned ? "Perfect week!" : "Complete every day to earn a gold star"
            },
            [h("span", { class: "stamp", text: earned ? "★" : "☆" })]
          )
        );
        box.append(grid);
        main.append(box);

        main.append(h("div", { class: "section-title", text: "Established · balance by category" }));
        const cb = h("div", { class: "week-detail" });
        state.cats.forEach((c) => {
          const s = w.cats[c.id];
          if (s) cb.append(barRow(c.name, s.d + " / " + s.p, Math.round((100 * s.d) / s.p), c.color, c.color));
        });
        if (!cb.children.length) cb.append(h("div", { class: "sub", text: "Nothing counted yet this week." }));
        main.append(cb);

        if (w.counts.length) {
          main.append(h("div", { class: "section-title", text: "Established · weekly counts" }));
          const wc = h("div", { class: "week-detail" });
          w.counts.forEach(({ b, raw, due }) =>
            wc.append(
              barRow(
                b.emoji + " " + b.name,
                raw + " / " + due,
                due ? Math.min(100, Math.round((100 * raw) / due)) : 0,
                "var(--ink)"
              )
            )
          );
          main.append(wc);
        }
        main.append(h("div", { class: "section-title", style: "color:var(--grow)", text: "Building · this week" }));
        const bb = h("div", { class: "week-detail" });
        w.items.forEach(({ b, raw, due }) =>
          bb.append(
            barRow(
              b.emoji + " " + b.name,
              raw + " / " + due,
              due ? Math.min(100, Math.round((100 * raw) / due)) : 0,
              "var(--grow)"
            )
          )
        );
        if (!w.items.length)
          bb.append(h("div", { class: "sub", text: "No habits in Building. Add one in the Blocks tab." }));
        main.append(bb);
      }

      const mq = window.matchMedia("(min-width: 900px)");
      const desk = () => mq.matches;
      function syncTab(t) {
        activeTab = t;
        document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === t));
      }
      function placeNav() {
        const nav = document.querySelector("nav.tabs");
        if (desk()) $(".left").prepend(nav);
        else document.body.append(nav);
      }
      function renderBar() {
        const bar = $("#weekbar");
        bar.hidden = !(desk() || activeTab !== "today");
        if (!bar.hidden) bar.replaceChildren(...weekNav().childNodes);
      }

      function renderAll() {
        if (desk() && activeTab === "week") syncTab("today");
        renderHeader();
        renderBar();
        if (desk()) {
          renderWeek($("#weekMain"));
          if (activeTab === "blocks") renderBlocks();
          else renderToday();
        } else if (activeTab === "today") renderToday();
        else if (activeTab === "blocks") renderBlocks();
        else renderWeek($("#main"));
      }

      document.querySelectorAll("nav.tabs button").forEach((btn) => {
        btn.onclick = () => {
          if (btn.dataset.tab === "today" && activeTab === "today") {
            viewDate = new Date();
            renderAll();
            return;
          }
          if (btn.dataset.tab !== "blocks" && wkKey(viewDate) > thisWk()) viewDate = new Date();
          syncTab(btn.dataset.tab);
          renderAll();
        };
      });

      mq.addEventListener("change", () => {
        placeNav();
        renderAll();
      });
      placeNav();
      saveState();
      renderAll();
    </script>
  </body>
</html>
